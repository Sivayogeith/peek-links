<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @font-face {
        font-family: "saira";
        src: url("Saira-Regular.ttf");
      }

      body {
        font-family: "saira", sans-serif;
        height: auto;
        width: 225px;
        font-size: 14px;
      }

      button {
        padding: 0.4rem 0.8rem;
        background-color: #373737;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 15px;
      }

      button:hover {
        background-color: #4a4a4a;
      }
    </style>
  </head>
  <body style="gap: 10px; display: flex; flex-direction: column">
    <div>
      background: <input type="color" id="background-input" />
    </div>
    <div>
      text color: <input type="color" id="color-input" />
    </div>
    <div
     
      style="display: flex; align-items: end; gap: 5px"
    >
      font size:
      <input
        type="range"
        id="font-size-input"
        name="font-size"
        min="8"
        max="20"
        style="margin: 0"
      />
    </div>
    <div>
      position: 
      <select name="position" id="position-input" style="background-color: white; padding: 5px; border-radius: 10px; border: 1px gray solid;">
        <option value="bottom-left" selected>bottom left</option>
        <option value="bottom-center">bottom center</option>
        <option value="bottom-right">bottom right</option>
        <option value="top-left">top left</option>
        <option value="top-center">top center</option>
        <option value="top-right">top right</option>
      </select>
    </div>
    <div
     
      style="justify-content: center; display: flex; gap: 10px"
    >
      <button id="save">save</button>
      <button id="reset">reset</button>
    </div>
    <script src="constants.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
